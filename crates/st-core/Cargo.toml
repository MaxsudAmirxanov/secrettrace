[package]
name = "st-core"
description = "SecretTrace core: normalization, digests, hints and masking shared by server, CLI and agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Derives sqlx::Type for the enums so the server can bind them to Postgres ENUMs.
sqlx = ["dep:sqlx"]
# Derives utoipa::ToSchema for API documentation.
openapi = ["dep:utoipa"]

[dependencies]
hex.workspace = true
serde.workspace = true
sha2.workspace = true
sqlx = { workspace = true, optional = true }
subtle.workspace = true
thiserror.workspace = true
utoipa = { workspace = true, optional = true }
zeroize.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
