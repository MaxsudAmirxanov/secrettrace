# SecretTrace TLS edge. Runs as uid 101 on a read-only filesystem (writable /tmp only).
#   :8443 (published as 443)  TLS → web UI and /api, except ingest
#   :9443 (published as 8443) mTLS (client certificate from deploy/pki) → /api/v1/ingest only
# The server trusts X-Forwarded-For and X-SecretTrace-Client-CN only from this proxy's
# address (ST_TRUSTED_PROXIES), so both are always overwritten here, never passed through.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Path only (no query string), method, status, timing and the client-certificate CN.
    log_format edge escape=json
        '{"time":"$time_iso8601","remote":"$remote_addr","port":"$server_port","method":"$request_method",'
        '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
        '"client_cn":"$ssl_client_cn","request_id":"$upstream_http_x_request_id"}';
    access_log /dev/stdout edge;

    # TLS: 1.2 and 1.3 only, forward-secret AEAD suites, no session tickets (no long-lived
    # ticket key in memory), OCSP not used (private CA, revocation through the CRL).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    ssl_certificate /etc/nginx/pki/fullchain.crt;
    ssl_certificate_key /etc/nginx/pki/server.key;

    # CN of a verified client certificate; empty when there is none.
    map $ssl_client_s_dn $ssl_client_cn {
        "~(^|,)CN=(?<cn>[^,]+)" $cn;
        default "";
    }

    upstream secrettrace {
        server server:8080;
        keepalive 16;
    }

    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    # Large findings bodies go straight to the server instead of a temp file.
    proxy_request_buffering off;

    server {
        listen 8443 ssl;
        http2 on;
        client_max_body_size 2m;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Machines use the mTLS listener; a token here would bypass the certificate check.
        location /api/v1/ingest/ {
            default_type application/problem+json;
            return 403 '{"type":"urn:secrettrace:problem:forbidden","title":"Forbidden","status":403,"detail":"ingest is only served on the mTLS port (8443) with a client certificate"}';
        }

        location / {
            include /etc/nginx/secrettrace/proxy_headers.conf;
            proxy_set_header X-SecretTrace-Client-CN "";
            proxy_pass http://secrettrace;
        }
    }

    server {
        listen 9443 ssl;
        client_max_body_size 16m;

        ssl_verify_client on;
        ssl_verify_depth 1;
        ssl_client_certificate /etc/nginx/pki/ca.crt;
        # An expired CRL makes every handshake fail: re-issue it with `pki.sh crl`.
        ssl_crl /etc/nginx/pki/crl.pem;
        # No certificate (496) or a rejected one (495: expired, revoked, unknown CA): a
        # problem+json answer instead of nginx's HTML 400.
        error_page 496 = @cert_missing;
        error_page 495 = @cert_invalid;

        location @cert_missing {
            default_type application/problem+json;
            return 403 '{"type":"urn:secrettrace:problem:forbidden","title":"Forbidden","status":403,"detail":"a client certificate is required on this port"}';
        }

        location @cert_invalid {
            default_type application/problem+json;
            return 403 '{"type":"urn:secrettrace:problem:forbidden","title":"Forbidden","status":403,"detail":"the client certificate was rejected: expired, revoked or not issued by the SecretTrace CA"}';
        }

        location /api/v1/ingest/ {
            include /etc/nginx/secrettrace/proxy_headers.conf;
            proxy_set_header X-SecretTrace-Client-CN $ssl_client_cn;
            proxy_pass http://secrettrace;
        }

        location = /healthz {
            include /etc/nginx/secrettrace/proxy_headers.conf;
            proxy_set_header X-SecretTrace-Client-CN "";
            proxy_pass http://secrettrace;
        }

        location / {
            default_type application/problem+json;
            return 404 '{"type":"urn:secrettrace:problem:not-found","title":"Not found","status":404}';
        }
    }
}
