# Headers for every proxied location (a location that sets any proxy_set_header loses the
# inherited ones, so each includes this file). X-Forwarded-For is replaced, not appended:
# the server takes its right-most entry as the client address.
proxy_set_header Host $host;
proxy_set_header Connection "";
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Request-Id "";
