# SecretTrace — MVP deployment.
# Prerequisites: `make secrets` and `make pki` (deploy/secrets/*, deploy/pki/out/*; never
# committed). `make up` runs both.
#
# Only the edge (nginx) is published: https://<host>/ for the web UI and API, and
# https://<host>:8443/api/v1/ingest/ with a client certificate for agents and CI. The
# server itself has no published port. ST_EDGE_BIND (default 127.0.0.1) sets the host
# address; ST_EDGE_SUBNET / ST_EDGE_PROXY_IP move the edge network if 10.213.0.0/24 is taken.
name: secrettrace

x-server-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: secrettrace
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      ST_OWNER_DB_PASSWORD_FILE: /run/secrets/owner_db_password
      ST_APP_DB_PASSWORD_FILE: /run/secrets/app_db_password
    secrets: [postgres_password, owner_db_password, app_db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secrettrace"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [db]
    restart: unless-stopped

  migrate:
    <<: *hardening
    build: .
    image: secrettrace-server:dev
    command: ["migrate"]
    environment:
      ST_DATABASE_URL_FILE: /run/secrets/app_database_url
      ST_MIGRATION_DATABASE_URL_FILE: /run/secrets/owner_database_url
      ST_PEPPER_KEYS_FILE: /run/secrets/pepper_keys
      ST_DATA_KEY_FILE: /run/secrets/data_key
    secrets: [app_database_url, owner_database_url, pepper_keys, data_key]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [db]
    restart: "no"

  server:
    <<: *hardening
    image: secrettrace-server:dev
    command: ["serve"]
    environment:
      ST_DATABASE_URL_FILE: /run/secrets/app_database_url
      ST_PEPPER_KEYS_FILE: /run/secrets/pepper_keys
      ST_DATA_KEY_FILE: /run/secrets/data_key
      ST_LOG_FORMAT: json
      # Secure cookies (`__Host-` prefix): served over TLS by the edge.
      ST_COOKIE_SECURE: "true"
      # The edge is the only trusted proxy: X-Forwarded-For and the verified client
      # certificate CN are taken from it alone. Every API token must be bound to a
      # client certificate (cert_cn) and come through the mTLS port.
      ST_TRUSTED_PROXIES: ${ST_EDGE_PROXY_IP:-10.213.0.10}
      ST_INGEST_REQUIRE_CLIENT_CERT: "true"
    secrets: [app_database_url, pepper_keys, data_key]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [db, edge]
    restart: unless-stopped

  edge:
    image: nginx:1.27-alpine
    # nginx directly: the image's entrypoint scripts rewrite config files, which a read-only
    # filesystem does not allow (and we do not want).
    entrypoint: ["nginx", "-g", "daemon off;"]
    user: "101:101"
    <<: *hardening
    tmpfs: ["/tmp:size=32m,mode=1777"]
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/proxy_headers.conf:/etc/nginx/secrettrace/proxy_headers.conf:ro
      # Single files: the CA private key never enters the container. A missing file is an
      # error (run `make pki`), not an empty directory created in its place.
      - { type: bind, source: ./deploy/pki/out/server/fullchain.crt, target: /etc/nginx/pki/fullchain.crt, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./deploy/pki/out/server/server.key, target: /etc/nginx/pki/server.key, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./deploy/pki/out/ca/ca.crt, target: /etc/nginx/pki/ca.crt, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./deploy/pki/out/ca/crl.pem, target: /etc/nginx/pki/crl.pem, read_only: true, bind: { create_host_path: false } }
    ports:
      - "${ST_EDGE_BIND:-127.0.0.1}:443:8443"
      - "${ST_EDGE_BIND:-127.0.0.1}:8443:9443"
    depends_on: [server]
    networks:
      edge:
        ipv4_address: ${ST_EDGE_PROXY_IP:-10.213.0.10}
    restart: unless-stopped

  worker:
    <<: *hardening
    build: { context: ., target: worker }
    image: secrettrace-worker:dev
    command: ["worker"]
    environment:
      ST_DATABASE_URL_FILE: /run/secrets/app_database_url
      ST_PEPPER_KEYS_FILE: /run/secrets/pepper_keys
      ST_LOG_FORMAT: json
      ST_WORKER_DATA_DIR: /var/lib/secrettrace/worker
      ST_WORKER_CREDENTIALS_DIR: /run/git-credentials
      ST_WORKER_SSH_KNOWN_HOSTS: /etc/secrettrace/ssh_known_hosts
      # Hosts sources may point at (comma-separated), e.g. github.com,gitlab.example. Required:
      # the worker refuses to start with an empty list unless ST_WORKER_ALLOW_ANY_HOST=true.
      ST_WORKER_ALLOWED_HOSTS: ${ST_WORKER_ALLOWED_HOSTS:-}
      ST_WORKER_ALLOW_ANY_HOST: ${ST_WORKER_ALLOW_ANY_HOST:-false}
      ST_WORKER_MAX_REPO_BYTES: ${ST_WORKER_MAX_REPO_BYTES:-2147483648}
    # No data_key: the worker never touches TOTP seeds.
    secrets: [app_database_url, pepper_keys]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 2g
    pids_limit: 256
    ulimits:
      core: 0
      nofile: { soft: 4096, hard: 4096 }
    volumes:
      - worker-data:/var/lib/secrettrace/worker
      - ./deploy/worker/git-credentials:/run/git-credentials:ro
      - ./deploy/worker/ssh_known_hosts:/etc/secrettrace/ssh_known_hosts:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [db, egress]
    restart: unless-stopped

secrets:
  postgres_password:  { file: ./deploy/secrets/postgres_password }
  owner_db_password:  { file: ./deploy/secrets/owner_db_password }
  app_db_password:    { file: ./deploy/secrets/app_db_password }
  owner_database_url: { file: ./deploy/secrets/owner_database_url }
  app_database_url:   { file: ./deploy/secrets/app_database_url }
  pepper_keys:        { file: ./deploy/secrets/pepper_keys }
  data_key:           { file: ./deploy/secrets/data_key }

volumes:
  pgdata:
  worker-data:

networks:
  # Postgres only: no route outside the host.
  db:
    internal: true
  # Edge proxy ↔ server. A fixed subnet gives the proxy a fixed address, the only one the
  # server trusts for forwarded headers.
  edge:
    ipam:
      config:
        - subnet: ${ST_EDGE_SUBNET:-10.213.0.0/24}
  # Outbound access for the worker (git hosts).
  egress:
